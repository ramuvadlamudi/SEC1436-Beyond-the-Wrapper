name: Validate ARIA RC11

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q aria *.py scripts

      - name: Create temporary non-live CI configuration
        run: cp .github/ci.env .env

      - name: Run RC11 package acceptance
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python validate_v3_acceptance.py --skip-live

      - name: Confirm sanitized GitHub source can be rebuilt
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/build_github_source.py
          python scripts/audit_github_release.py
